; Configuracion de las herramientas de calidad de codigo del proyecto.
; Tenerla en el repositorio hace que `python -m flake8` use el mismo criterio para
; cualquiera que clone el proyecto, sin tener que acordarse de pasar los parametros.

[flake8]
; 88 columnas es el largo que usa black por omision y el que se fijo en clase.
; Dejar flake8 en su valor por defecto (79) lo pondria a pelear contra black.
max-line-length = 88

; Se excluyen las carpetas que no contienen codigo propio.
exclude =
    .git,
    .ipynb_checkpoints,
    __pycache__,
    .venv,
    salidas

; E203: black deja un espacio antes de los dos puntos en los cortes de rebanada
;       (x[1 : n]); pycodestyle lo marca y black lo vuelve a poner. Es el unico
;       desacuerdo conocido entre las dos herramientas, asi que gana black.
; W503: corta la linea antes del operador binario, que es lo que hace black y lo que
;       hoy se considera mas legible. El aviso contrario (W504) es el vigente.
extend-ignore = E203, W503

[pylint]
max-line-length = 88

; Cada exclusion va con su motivo. La idea no es subir el puntaje: es dejar por escrito
; por que ese aviso no aplica a este proyecto.
;
; use-dict-literal (R1735): Plotly y Matplotlib documentan sus parametros anidados con
;   dict(...), y asi se leen igual que los ejemplos oficiales. Cambiarlos por {...} haria
;   el codigo mas largo y menos parecido a la documentacion de esas librerias.
; redefined-outer-name (W0621): en un notebook todo vive en el ambito global, asi que un
;   parametro de funcion que se llama igual que una variable del notebook es inevitable.
;   El alcance real de cada nombre se ve en la funcion, que es corta.
; consider-using-f-string (C0209): el unico caso es "{:.1%}".format pasado como funcion a
;   .map(). Un f-string no se puede pasar como referencia a una funcion: el aviso no aplica.
; chained-comparison (R1716): los dos casos comparan variables DISTINTAS contra el mismo
;   umbral (p_sola y p_multi contra 0,05). Encadenarlas seria menos legible, no mas.
; missing-module-docstring (C0114) y invalid-name (C0103): un notebook no es un modulo y
;   sus nombres de constantes viven dentro de celdas, no en el encabezado de un archivo.
disable =
    use-dict-literal,
    redefined-outer-name,
    consider-using-f-string,
    chained-comparison,
    missing-module-docstring,
    invalid-name,
    pointless-statement,
    too-many-lines,
    too-many-locals,
    too-many-statements
